
services:
  # Website - Frontend interface (React + Vite)
  browserworkshop-website:
    container_name: browserworkshop-website
    image: browserworkshop-website
    build:
      context: ../..
      dockerfile: ./.workflows/dev/website/Dockerfile
      args:
        NODE_VERSION: "26.6.0"
        PNPM_VERSION: "11.20.0"
    ports:
      - "127.0.0.1:${WEBSITE_HOST_PORT:-5174}:5174"
    volumes:
      # Full application package - bind-mounted from host (including node_modules)
      - ../..:/workspace:cached

